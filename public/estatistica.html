<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statis - Bolão 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; }
        .tab-active { border-bottom: 3px solid #FFD700; color: #FFD700; }
        .chart-container::-webkit-scrollbar { width: 8px; }
        .chart-container::-webkit-scrollbar-track { background: #1e293b; }
        .chart-container::-webkit-scrollbar-thumb { background: #FFD700; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen font-sans">

    <main class="max-w-5xl mx-auto px-4 py-2 mt-0 content-start justify-start text-left items-start">
        <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
            <h1 class="text-xl font-bold tracking-wider text-yellow-500 uppercase flex items-center gap-2">
                <i class="fas fa-chart-bar"></i> Painel de Estatísticas do Bolão
            </h1>
            <a href="index.html" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded transition-all">
                <i class="fas fa-arrow-left"></i> Voltar
            </a>
        </div>

        <div class="flex flex-wrap justify-between items-center gap-4 bg-slate-800/50 p-4 rounded-xl mb-6 border border-slate-700">
            <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
                <button onclick="mudarAba('geral')" id="btn-geral" class="px-4 py-2 rounded-md text-sm font-medium transition-all tab-active bg-slate-800 text-yellow-500">
                    Geral
                </button>
                <button onclick="mudarAba('gerencia')" id="btn-gerencia" class="px-4 py-2 rounded-md text-sm font-medium text-slate-400 hover:text-white transition-all">
                    Gerência
                </button>
                <button onclick="mudarAba('times')" id="btn-times" class="px-4 py-2 rounded-md text-sm font-medium text-slate-400 hover:text-white transition-all">
                    Equipes
                </button>
            </div>

            <div class="flex items-center gap-3">
                <div id="wrapper-metrica" class="flex bg-slate-900 p-1 rounded-lg border border-slate-700 hidden">
                    <button onclick="mudarMetrica('SOMA')" id="btn-soma" class="px-3 py-1 rounded text-xs bg-emerald-600 text-white font-bold">Soma</button>
                    <button onclick="mudarMetrica('MEDIA')" id="btn-media" class="px-3 py-1 rounded text-xs text-slate-400">Média</button>
                </div>

                <div id="wrapper-limite" class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button onclick="mudarLimite(15)" id="btn-lim15" class="px-3 py-1 rounded text-xs bg-blue-600 text-white font-bold">Top 15</button>
                    <button onclick="mudarLimite(50)" id="btn-lim50" class="px-3 py-1 rounded text-xs text-slate-400">Top 50</button>
                    <button onclick="mudarLimite(0)" id="btn-limAll" class="px-3 py-1 rounded text-xs text-slate-400">Todos</button>
                </div>
            </div>
        </div>

        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl w-full top-0 sticky">
            <h3 id="titulo-grafico" class="text-md font-bold text-slate-300 mb-4 flex items-center gap-2 uppercase tracking-wide">
            </h3>
            <div class="relative w-full chart-container overflow-y-auto block clean-block" style="height: 550px; max-height: 600px;">
                <canvas id="chartPrincipal" class="block w-full m-0 p-0"></canvas>
            </div>
        </div>
    </main>

    <script>
        // CORREÇÃO ESSENCIAL: Registrar globalmente o plugin de DataLabels para o Chart.js v3+
        Chart.register(ChartDataLabels);

        let abaAtual = 'geral';
        let metricaAtual = 'SOMA';
        let limiteAtual = 15;
        let chartInstance = null;

        function mudarAba(aba) {
            abaAtual = aba;
            
            ['geral', 'gerencia', 'times'].forEach(a => {
                const btn = document.getElementById(`btn-${a}`);
                if (a === aba) {
                    btn.classList.add('bg-slate-800', 'text-yellow-500');
                    btn.classList.remove('text-slate-400');
                } else {
                    btn.classList.remove('bg-slate-800', 'text-yellow-500');
                    btn.classList.add('text-slate-400');
                }
            });

            if (aba === 'geral') {
                document.getElementById('wrapper-metrica').classList.add('hidden');
                document.getElementById('wrapper-limite').classList.remove('hidden');
            } else {
                document.getElementById('wrapper-metrica').classList.remove('hidden');
                document.getElementById('wrapper-limite').classList.add('hidden');
            }

            carregarDadosEstatistica();
        }

        function mudarMetrica(metrica) {
            metricaAtual = metrica;
            document.getElementById('btn-soma').className = metrica === 'SOMA' ? 'px-3 py-1 rounded text-xs bg-emerald-600 text-white font-bold' : 'px-3 py-1 rounded text-xs text-slate-400';
            document.getElementById('btn-media').className = metrica === 'MEDIA' ? 'px-3 py-1 rounded text-xs bg-emerald-600 text-white font-bold' : 'px-3 py-1 rounded text-xs text-slate-400';
            carregarDadosEstatistica();
        }

        function mudarLimite(limite) {
            limiteAtual = limite;
            document.getElementById('btn-lim15').className = limite === 15 ? 'px-3 py-1 rounded text-xs bg-blue-600 text-white font-bold' : 'px-3 py-1 rounded text-xs text-slate-400';
            document.getElementById('btn-lim50').className = limite === 50 ? 'px-3 py-1 rounded text-xs bg-blue-600 text-white font-bold' : 'px-3 py-1 rounded text-xs text-slate-400';
            document.getElementById('btn-limAll').className = limite === 0 ? 'px-3 py-1 rounded text-xs bg-blue-600 text-white font-bold' : 'px-3 py-1 rounded text-xs text-slate-400';
            carregarDadosEstatistica();
        }

        async function carregarDadosEstatistica() {
            try {
                let url = `/api/estatisticas/${abaAtual}`;
                if (abaAtual !== 'geral') {
                    url += `?tipo=${metricaAtual}`;
                }

                const res = await fetch(url);
                const resJson = await res.json();
                
                if (!resJson.success || !resJson.dados) return;

                let dadosProcessados = resJson.dados;
                let titulo = "";
                let labelEixo = "";
                let corBarra = "";

                if (abaAtual === 'geral') {
                    titulo = `<i class="fas fa-users text-blue-500"></i> Ranking Geral por Apelido`;
                    labelEixo = "Apelido";
                    corBarra = 'rgba(59, 130, 246, 0.85)';
                    
                    if (limiteAtual > 0) {
                        dadosProcessados = dadosProcessados.slice(0, limiteAtual);
                        titulo += ` (Top ${limiteAtual})`;
                    }
                } else if (abaAtual === 'gerencia') {
                    titulo = `<i class="fas fa-sitemap text-emerald-500"></i> Desempenho por Gerência (${metricaAtual.toLowerCase()})`;
                    labelEixo = "Gerencia";
                    corBarra = 'rgba(16, 185, 129, 0.85)';
                } else {
                    titulo = `<i class="fas fa-people-group text-cyan-500"></i> Desempenho por Equipes de Trabalho (${metricaAtual.toLowerCase()})`;
                    labelEixo = "Time";
                    corBarra = 'rgba(6, 182, 212, 0.85)';
                }

                document.getElementById('titulo-grafico').innerHTML = titulo;

                const labels = dadosProcessados.map(item => item[labelEixo] || "Não Informado");

                if (abaAtual === 'geral') {
                    const qtd10 = dadosProcessados.map(item => item.Qtd10 || 0);
                    const qtd25 = dadosProcessados.map(item => item.Qtd25 || 0);
                    renderizarGraficoHorizontal(labels, { geral: true, qtd10, qtd25 }, corBarra);
                } else {
                    const valores = dadosProcessados.map(item => item.TotalPontos);
                    renderizarGraficoHorizontal(labels, { geral: false, valores }, corBarra);
                }
            } catch (error) {
                console.error("Erro na requisição das estatísticas:", error);
            }
        }

        function renderizarGraficoHorizontal(labels, dadosEstruturados, corBarraPadrao) {
            const ctx = document.getElementById('chartPrincipal').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            const alturaDinamica = Math.max(500, labels.length * 28);
            const canvasContainer = document.getElementById('chartPrincipal').parentElement;
            canvasContainer.style.height = `${alturaDinamica}px`;

            let datasetsConfig = [];

            if (dadosEstruturados.geral) {
                datasetsConfig = [
                    {
                        label: 'Acertos de 10 pts',
                        data: dadosEstruturados.qtd10,
                        backgroundColor: 'rgba(14, 165, 233, 0.65)',
                        borderRadius: { topLeft: 0, bottomLeft: 0, topRight: 0, bottomRight: 0 },
                        barThickness: 18,
                        metaTipo: '10p'
                    },
                    {
                        label: 'Acertos de 25 pts',
                        data: dadosEstruturados.qtd25,
                        backgroundColor: 'rgba(29, 78, 216, 0.95)',
                        borderRadius: { topRight: 6, bottomRight: 6, topLeft: 0, bottomLeft: 0 },
                        borderSkipped: false,
                        barThickness: 18,
                        metaTipo: '25p'
                    }
                ];
            } else {
                datasetsConfig = [{
                    label: 'Pontos Totais',
                    data: dadosEstruturados.valores,
                    backgroundColor: corBarraPadrao,
                    borderRadius: 6,
                    borderSkipped: false,
                    barThickness: 18
                }];
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasetsConfig
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { top: 5, bottom: 5, left: 0, right: 25 }
                    },
                    plugins: {
                        legend: { 
                            display: dadosEstruturados.geral,
                            position: 'top',
                            labels: { color: '#94a3b8', font: { size: 12, weight: '500' } }
                        },
                        datalabels: {
                            color: '#fff',
                            font: { weight: 'bold', size: 10 },
                            anchor: dadosEstruturados.geral ? 'center' : 'end',
                            align: dadosEstruturados.geral ? 'center' : 'left',
                            offset: dadosEstruturados.geral ? 0 : 8,
                            formatter: (value, context) => {
                                if (value === 0) return '';
                                
                                if (dadosEstruturados.geral) {
                                    const tipo = context.dataset.metaTipo;
                                    return `${value}x (${tipo})`;
                                }
                                return value;
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: dadosEstruturados.geral,
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: '#94a3b8',
                                callback: function(value) {
                                    return dadosEstruturados.geral ? value + ' jogos' : value + ' pts';
                                }
                            }
                        },
                        y: {
                            stacked: dadosEstruturados.geral,
                            grid: { display: false },
                            ticks: { 
                                color: '#f8fafc',
                                font: { weight: '600' }
                            }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            mudarAba('geral');
        });
    </script>
</body>
</html>
